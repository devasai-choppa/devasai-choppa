name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: devasai-choppa
          SETTING_JSON: profile-3d-contrib/hud.json

      - name: Commit skyline SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-hud-light.svg profile-3d-contrib/profile-hud-dark.svg
          if git diff --staged --quiet; then
            echo "Skyline SVGs unchanged."
            exit 0
          fi
          git commit -m "chore: update 3D contribution skyline"
          git pull --rebase origin main
          git push
