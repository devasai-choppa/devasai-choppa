name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: devasai-choppa
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=0C7C78&color_dots=F4F7F8,D5E8E6,7DCCC4,0C7C78,C2185B
            dist/github-contribution-grid-snake-dark.svg?color_snake=00F5D4&color_dots=0D1117,12343A,0F766E,00F5D4,F72585

      - name: Commit snake SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          if git diff --staged --quiet; then
            echo "Snake SVGs unchanged."
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git pull --rebase origin main
          git push
