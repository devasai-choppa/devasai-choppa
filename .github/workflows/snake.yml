name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: devasai-choppa
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=8D6A32&color_dots=F7F3EC,E7DFD2,C4A36A,8D6A32,9A4636
            dist/github-contribution-grid-snake-dark.svg?color_snake=E4C58A&color_dots=0C0B0A,2A241C,8D6A32,E4C58A,E07A5F

      - name: Commit snake SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          if git diff --staged --quiet; then
            echo "Snake SVGs unchanged."
            exit 0
          fi
          git commit -m "chore: update contribution snake"
          git pull --rebase origin main
          git push
