<svg xmlns="http://www.w3.org/2000/svg" width="820" height="40" viewBox="0 0 820 40" role="img" aria-labelledby="title">
  <title id="title">Agents that retrieve, score, and flag. Warehouses with a leakage gate. Healthcare data, applied AI.</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>
  <rect width="820" height="40" fill="#FFFFFF" stroke="#D3DEE5"/>
  <rect width="3" height="40" fill="#0F6E6A"/>
  <text x="16" y="26" fill="#0F6E6A" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="18">&gt;</text>
  <g class="motion" opacity="1">
    <text x="36" y="26" fill="#0B1F33" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="18">Agents that retrieve, score, and flag</text>
    <rect x="443.5" y="10" width="2" height="18" fill="#0F6E6A"/>
    <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.30;0.36;0.66;0.94;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g class="motion" opacity="0">
    <text x="36" y="26" fill="#0B1F33" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="18">Warehouses with a leakage gate</text>
    <rect x="367.9" y="10" width="2" height="18" fill="#0F6E6A"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.64;0.70;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g class="motion" opacity="0">
    <text x="36" y="26" fill="#0B1F33" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="18">Healthcare data, applied AI</text>
    <rect x="335.5" y="10" width="2" height="18" fill="#0F6E6A"/>
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.64;0.70;0.94;0.98;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
